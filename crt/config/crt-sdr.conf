# Use explicitly: mpv --include=crt/crt-sdr.conf <video>
# Select the TV refresh in Windows: 119.88 Hz for 23.976 fps; 100 Hz for 25 fps.
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
d3d11-adapter=NVIDIA GeForce RTX 2060
d3d11-flip=yes
d3d11-sync-interval=1
hwdec=d3d11va
video-sync=display-vdrop
speed=1
interpolation=no
crt-beam=yes
crt-beam-scans=2
crt-beam-gain=0
target-prim=bt.709
target-trc=gamma2.2
target-contrast=inf
fullscreen=yes
# Begin at SDR RGB 10-bit. Verify the actual link and stable presentation.
# Swapchain format does not determine the physical DisplayPort/HDMI bit depth.
d3d11-output-format=rgb10_a2

[crt-single]
crt-beam-scans=1

[crt-double]
crt-beam-scans=2

[crt-gamma24]
# Select only if the measured/configured TV response is gamma 2.4.
target-trc=gamma2.4

[crt-off]
crt-beam=no
